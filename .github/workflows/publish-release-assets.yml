name: Publish release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Attach installers to release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      API_ROOT: https://api.github.com/repos/${{ github.repository }}
      TAG: ${{ inputs.tag }}

    steps:
      - name: Resolve latest artifact IDs
        shell: bash
        run: |
          set -euo pipefail
          resolve_artifact() {
            local artifact_name="$1"
            curl --fail --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              "${API_ROOT}/actions/artifacts?name=${artifact_name}&per_page=100" \
              | jq -r --arg name "${artifact_name}" '
                  [.artifacts[] | select(.name == $name)] | max_by(.created_at)
                  | if . == null then
                      "NOT_FOUND"
                    elif .expired then
                      "EXPIRED " + .created_at
                    else
                      "\(.id) \(.created_at)"
                    end'
          }

          map_artifact() {
            local artifact_name="$1" env_name="$2" resolved id created_at
            resolved=$(resolve_artifact "${artifact_name}")
            case "${resolved}" in
              NOT_FOUND)
                echo "::error::No artifact named ${artifact_name}. Have the build workflows finished?"
                exit 1
                ;;
              EXPIRED*)
                echo "::error::The newest ${artifact_name} artifact (created ${resolved#EXPIRED }) is expired. Re-run the build workflows."
                exit 1
                ;;
            esac
            read -r id created_at <<< "${resolved}"
            echo "${env_name}=${id}" >> "${GITHUB_ENV}"
            echo "Resolved ${artifact_name} -> artifact ${id} (created ${created_at})"
          }

          map_artifact MAD-Toolbox-Windows-x64-Full WINDOWS_FULL_ARTIFACT_ID
          map_artifact MAD-Toolbox-Windows-x64-Lite WINDOWS_LITE_ARTIFACT_ID
          map_artifact MAD-Toolbox-macOS-Apple-Silicon-Full MACOS_FULL_ARTIFACT_ID
          map_artifact MAD-Toolbox-macOS-Apple-Silicon-Lite MACOS_LITE_ARTIFACT_ID

      - name: Download CI artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/windows-full staging/windows-lite staging/macos-full staging/macos-lite dist

          download_artifact() {
            local artifact_id="$1"
            local output="$2"
            curl --fail --location --retry 3 \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              "${API_ROOT}/actions/artifacts/${artifact_id}/zip" \
              --output "$output"
          }

          download_artifact "$WINDOWS_FULL_ARTIFACT_ID" /tmp/windows-full.zip
          download_artifact "$WINDOWS_LITE_ARTIFACT_ID" /tmp/windows-lite.zip
          download_artifact "$MACOS_FULL_ARTIFACT_ID" /tmp/macos-full.zip
          download_artifact "$MACOS_LITE_ARTIFACT_ID" /tmp/macos-lite.zip

          unzip -q /tmp/windows-full.zip -d staging/windows-full
          unzip -q /tmp/windows-lite.zip -d staging/windows-lite
          unzip -q /tmp/macos-full.zip -d staging/macos-full
          unzip -q /tmp/macos-lite.zip -d staging/macos-lite

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          windows_full=$(find staging/windows-full -type f -name '*.exe' -print -quit)
          windows_lite=$(find staging/windows-lite -type f -name '*.exe' -print -quit)
          macos_full=$(find staging/macos-full -type f -name '*.dmg' -print -quit)
          macos_lite=$(find staging/macos-lite -type f -name '*.dmg' -print -quit)
          test -n "$windows_full"
          test -n "$windows_lite"
          test -n "$macos_full"
          test -n "$macos_lite"

          # GitHub release assets replace spaces with dots in uploaded names.
          # Use the final names here so SHA256SUMS.txt is verifiable after
          # downloading assets from the release page.
          cp "$windows_full" "dist/MAD.Toolbox_${TAG#v}_x64-Full-setup.exe"
          cp "$windows_lite" "dist/MAD.Toolbox_${TAG#v}_x64-Lite-setup.exe"
          cp "$macos_full" "dist/MAD.Toolbox_${TAG#v}_aarch64-Full.dmg"
          cp "$macos_lite" "dist/MAD.Toolbox_${TAG#v}_aarch64-Lite.dmg"

          (cd dist && shasum -a 256 *.exe *.dmg > SHA256SUMS.txt)

      - name: Upload release assets
        shell: bash
        run: gh release upload "$TAG" dist/*.exe dist/*.dmg dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
