name: Build Windows x64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 ${{ matrix.edition }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        edition: [Full, Lite]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64-${{ matrix.edition }}

      - name: Install frontend packages
        run: npm ci

      - name: Prepare verified sidecars
        shell: pwsh
        run: ./scripts/prepare-windows-tools.ps1 -Edition ${{ matrix.edition }}

      - name: Verify sidecars
        shell: pwsh
        run: ./scripts/verify-windows-tools.ps1 -Edition ${{ matrix.edition }}

      - name: Check frontend
        run: npm run check

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build unsigned NSIS installer
        shell: pwsh
        run: |
          $Config = if ("${{ matrix.edition }}" -eq "Full") {
            "src-tauri/tauri.windows.full.conf.json"
          } else {
            "src-tauri/tauri.windows.lite.conf.json"
          }
          npx tauri build --target x86_64-pc-windows-msvc --config $Config --no-sign --ci

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MAD-Toolbox-Windows-x64-${{ matrix.edition }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
